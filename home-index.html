<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Propostas RISE · Design & Branding</title>
<meta name="description" content="Área de propostas e orçamentos da RISE Design & Branding. Cada projeto recebe um link exclusivo.">
<meta name="theme-color" content="#1E4034">
<meta property="og:type" content="website">
<meta property="og:title" content="Propostas RISE · Design & Branding">
<meta property="og:description" content="Área de propostas da RISE. Cada projeto tem um link exclusivo.">
<meta property="og:url" content="https://orcamento.riseagencia.com">
<meta property="og:locale" content="pt_BR">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#FF4D00;--orange-soft:#FF7A3D;
    --forest:#1E4034;--forest-soft:#2E5D45;
    --ink:#1A1714;--muted:#6B6258;--line:#E9E2D8;
    --paper:#FAF7F2;--card:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);
    background:var(--paper);min-height:100vh;line-height:1.55;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
  }
  .bg{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(60% 50% at 85% 12%,rgba(255,77,0,.07),transparent 70%),
      radial-gradient(55% 45% at 8% 90%,rgba(30,64,52,.07),transparent 70%);
  }
  .shell{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;padding:32px 22px}
  .card{
    width:100%;max-width:560px;background:var(--card);
    border:1px solid var(--line);border-radius:24px;
    padding:48px 42px;
    box-shadow:0 1px 2px rgba(26,23,20,.04),0 24px 60px rgba(26,23,20,.08);
    text-align:center;
    opacity:0;transform:translateY(14px);
    animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards;
  }
  @keyframes rise{to{opacity:1;transform:none}}
  .eyebrow{
    display:inline-flex;align-items:center;gap:9px;
    font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--orange);
  }
  .eyebrow .dash{width:26px;height:2px;background:var(--orange);border-radius:2px;display:inline-block}
  h1{
    font-family:'Fraunces',Georgia,serif;font-weight:500;
    font-size:clamp(32px,7vw,46px);line-height:1.04;letter-spacing:-.01em;
    margin:20px 0 14px;
  }
  h1 em{font-style:italic;color:var(--forest)}
  p.lead{font-size:16.5px;color:#473f37;max-width:42ch;margin:0 auto}
  .rule{width:46px;height:3px;background:var(--orange);border-radius:3px;margin:26px auto 24px}
  .btn{
    display:inline-block;background:var(--forest);color:#fff;text-decoration:none;
    font-weight:700;font-size:15px;padding:14px 30px;border-radius:99px;
    transition:transform .15s ease,background .15s ease;
  }
  .btn:hover{background:var(--forest-soft);transform:translateY(-1px)}
  .contact{margin-top:24px;font-size:14px;color:var(--muted)}
  .contact a{color:var(--ink);text-decoration:none;font-weight:600;border-bottom:1px solid var(--line)}
  .contact a:hover{border-color:var(--orange)}
  footer{
    position:relative;z-index:1;text-align:center;
    padding:22px;font-size:12px;color:var(--muted);
  }
  @media(max-width:480px){.card{padding:38px 26px}}
</style>
</head>
<body>
<div class="bg"></div>

<div class="shell">
  <main class="card">
    <span class="eyebrow"><span class="dash"></span>Rise Design &amp; Branding</span>
    <h1>Propostas &amp;<br><em>Orçamentos</em></h1>
    <div class="rule"></div>
    <p class="lead">Você chegou na área de propostas da RISE. Cada projeto recebe um link exclusivo, enviado diretamente a você.</p>
    <div style="margin-top:30px">
      <a class="btn" href="https://riseagencia.com">Conhecer a RISE</a>
    </div>
    <div class="contact">
      Recebeu um orçamento e ficou com dúvida?<br>
      Fale com a gente no <a href="https://wa.me/5592991755756">WhatsApp</a>.
    </div>
  </main>
</div>

<footer>© <span id="y"></span> RISE Design &amp; Branding · riseagencia.com</footer>
<script>document.getElementById('y').textContent=new Date().getFullYear();</script>
</body>
</html>
